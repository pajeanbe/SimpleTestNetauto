- name: Secure switch ports with Ansible
  hosts: SW1
  gather_facts: no

  tasks:
    - name: list all working interfaces
      cisco.ios.ios_command:
        commands:
          - show ip interface brief | include up
      register: interfaces


    - name: LIST interfaces
      debug:
        msg: >-
          {{ 
          
          
          {% set interface_names = interfaces.stdout_lines | map('split') | map('first') | list %}
          
          {{ interface_names }} 
          
          }}