- name: Shutdown interfaces with no traffic
  hosts: switches
  gather_facts: no
  connection: network_cli

  tasks:
    - name: Get interface statistics
      cisco.ios.ios_command:
        commands:
          - show interfaces
      register: interface_output

    - name: Parse interfaces with zero traffic
      set_fact:
        unused_interfaces: >-
          {{
            interface_output.stdout[0].split('\n\n') | selectattr('search', 'search', 'GigabitEthernet') |
            selectattr('search', 'search', 'packets input 0,') |
            selectattr('search', 'search', 'packets output 0,') |
            map('regex_search', 'interface (\S+)', '\\1') | list
          }}

    - name: Shutdown unused interfaces
      cisco.ios.ios_config:
        lines:
          - shutdown
        parents: "interface {{ item }}"
      loop: "{{ unused_interfaces }}"