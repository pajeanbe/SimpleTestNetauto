- name: Shutdown interfaces with no traffic using filter plugin
  hosts: SW1
  gather_facts: no
  connection: network_cli

  tasks:
    - name: Get interface statistics
      cisco.ios.ios_command:
        commands:
          - show interfaces stats
      register: interface_output
    - name: debug
      debug:
        msg: "{{ interface_output.stdout_lines[0] }}"


    - name: Extract unused interfaces using custom filter
      set_fact:
        unused_interfaces: "{{ interface_output.stdout_lines[0] | find_unused_interfaces_on_cisco_nodes }}"

    - name: debug
      debug:
        msg: "{{ unused_interfaces }}"


    - name: Shutdown unused interfaces
      cisco.ios.ios_config:
        lines:
          - shutdown
        parents: "interface {{ item }}"
      loop: "{{ unused_interfaces }}"