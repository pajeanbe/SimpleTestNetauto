- name: Backup Nodes
  hosts: all
  gather_facts: no
  tasks:
    - name: log time stamp
      ansible.builtin.set_fact:
        log_timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"
      delegate_to: localhost
      run_once: true

    - name: backup Cisco node
      ios_command:
        commands: show run
      register: output
      when: ansible_network_os == 'ios'

    - name: debug
      debug:
       msg: "{{ output.stdout_lines }}"

    - name: Save config to local file
      ansible.builtin.copy:
        content: "{{ output.stdout_lines }}"
        dest: "{{ playbook_dir }}/../tmp/backup/{{ inventory_hostname }}_{{ log_timestamp }}.cfg"
      delegate_to: localhost

